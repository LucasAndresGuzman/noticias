# Blueprint de Render: base de datos, API privada y proceso que lee noticias.
# Las tres piezas comparten región para poder usar la conexión interna.
# Las claves BASIC_AUTH_USER y BASIC_AUTH_PASS NO van en este archivo: se cargan en el panel de Render.

databases:
  - name: verificador-db
    databaseName: verificador
    user: verificador
    plan: free
    region: oregon

services:
  - type: web
    name: verificador-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run web
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verificador-db
          property: connectionString
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false

  - type: worker
    name: verificador-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verificador-db
          property: connectionString
      - key: WORKER_INTERVAL_MIN
        value: "5"
